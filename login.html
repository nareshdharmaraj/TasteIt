<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TasteIT</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            height: 100vh;
            width: 100vw;
        }

        .auth-container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* Left Side - Image/Branding */
        .auth-visual {
            flex: 1;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.9), rgba(44, 62, 80, 0.9)),
                url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: var(--spacing-3xl);
            position: relative;
            overflow: hidden;
        }

        .auth-visual::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
        }

        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .auth-brand {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .auth-logo {
            font-size: 4rem;
            margin-bottom: var(--spacing-lg);
            animation: pulse 2s infinite;
        }

        .auth-brand h1 {
            font-size: 3.5rem;
            margin-bottom: var(--spacing-md);
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        .auth-brand p {
            font-size: 1.3rem;
            opacity: 0.95;
            max-width: 400px;
            line-height: 1.6;
        }

        .auth-features {
            margin-top: var(--spacing-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: 1.1rem;
        }

        .feature-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Right Side - Form */
        .auth-form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-3xl);
            background: var(--bg-primary);
            position: relative;
        }

        .auth-form-wrapper {
            width: 100%;
            max-width: 450px;
            animation: fadeInRight 0.6s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .auth-header h2 {
            font-size: 2.5rem;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
            font-weight: 700;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Mobile Header Container */
        .mobile-auth-header {
            display: none;
        }

        /* Scale to Fit Wrapper */
        .auth-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transform-origin: top left;
        }

        [dir="rtl"] .auth-container {
            transform-origin: top right;
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 3rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            transition: all var(--transition-base);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        .form-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-wrapper label {
            cursor: pointer;
            color: var(--text-secondary);
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-fast);
        }

        .forgot-password:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: var(--spacing-md);
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-xl) 0;
            color: var(--text-secondary);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 var(--spacing-md);
        }

        .social-login {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            margin-bottom: var(--spacing-xl);
        }

        .social-btn {
            width: 50px;
            height: 50px;
            padding: 0;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-primary);
            cursor: pointer;
            transition: all var(--transition-base);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .social-btn.google {
            color: #DB4437;
        }

        .social-btn.facebook {
            color: #4267B2;
        }

        .social-btn.apple {
            color: #000;
        }

        .dark .social-btn.apple {
            color: #fff;
        }

        .auth-switch {
            text-align: center;
            margin-top: var(--spacing-xl);
            color: var(--text-secondary);
        }

        .auth-switch a {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .auth-switch a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-fast);
        }

        .back-home:hover {
            color: var(--primary-color);
        }

        /* Theme Toggle */
        .theme-toggle-auth {
            position: absolute;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            width: 50px;
            height: 26px;
            background: var(--border-color);
            border-radius: 13px;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        [dir="rtl"] .theme-toggle-auth {
            left: auto;
            right: var(--spacing-lg);
        }

        .theme-toggle-slider-auth {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .dark .theme-toggle-slider-auth {
            transform: translateX(24px);
        }

        /* RTL Toggle */
        .rtl-toggle-auth {
            position: absolute;
            top: var(--spacing-lg);
            left: 80px;
            background: transparent;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 0.5rem;
            cursor: pointer;
            z-index: 10;
            color: var(--text-primary);
        }

        [dir="rtl"] .rtl-toggle-auth {
            left: auto;
            right: 80px;
        }

        /* RTL Support */
        [dir="rtl"] .form-input {
            padding: var(--spacing-md) 3rem var(--spacing-md) var(--spacing-md);
        }

        [dir="rtl"] .form-icon {
            left: auto;
            right: 1rem;
        }

        [dir="rtl"] .password-toggle {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .back-home {
            right: auto;
            left: var(--spacing-lg);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .auth-visual {
                display: none;
            }

            .auth-form-container {
                flex: 1;
                padding: var(--spacing-lg);
                padding-top: 65px;
            }

            .mobile-auth-header {
                display: block;
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--bg-primary);
                padding: var(--spacing-sm) var(--spacing-md);
                border-bottom: 1px solid var(--border-color);
                z-index: 5;
            }

            [dir="rtl"] .mobile-auth-header {
                left: 0;
                right: 0;
            }

            .mobile-auth-header h2 {
                font-size: clamp(1.25rem, 4vw, 1.75rem);
                margin: 0;
                color: var(--text-primary);
            }

            .mobile-auth-header p {
                font-size: clamp(0.8rem, 2.5vw, 0.95rem);
                color: var(--text-secondary);
                margin: 0.25rem 0 0 0;
            }

            .auth-header {
                display: none;
            }

            .auth-form-wrapper {
                margin-top: 100px;
            }

            .theme-toggle-auth {
                top: 15px;
                left: 15px;
            }

            [dir="rtl"] .theme-toggle-auth {
                left: auto;
                right: 15px;
            }

            .rtl-toggle-auth {
                top: 15px;
                left: 70px;
            }

            [dir="rtl"] .rtl-toggle-auth {
                left: auto;
                right: 70px;
            }

            .back-home {
                top: 15px;
                right: 15px;
                font-size: clamp(0.75rem, 2vw, 0.9rem);
            }

            .back-home span {
                display: inline;
            }

            [dir="rtl"] .back-home {
                right: auto;
                left: 15px;
            }
        }

        @media (max-width: 480px) {
            .auth-form-container {
                padding: var(--spacing-sm);
                padding-top: 60px;
                overflow-y: auto;
            }

            .auth-form-wrapper {
                max-width: 100%;
                padding: 0;
                margin-top: 85px;
            }

            .mobile-auth-header {
                top: 55px;
                padding: var(--spacing-xs) var(--spacing-sm);
                text-align: center;
            }

            .mobile-auth-header h2 {
                font-size: clamp(1.1rem, 5vw, 1.4rem);
            }

            .mobile-auth-header p {
                font-size: clamp(0.75rem, 3vw, 0.85rem);
            }

            .social-login {
                gap: var(--spacing-sm);
                margin-bottom: var(--spacing-md);
            }

            .social-btn {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }

            .divider {
                margin: var(--spacing-md) 0;
            }

            .divider span {
                font-size: 0.85rem;
            }

            .social-login {
                grid-template-columns: 1fr;
            }

            .form-input {
                font-size: 16px;
                /* Prevents zoom on iOS */
            }

            .theme-toggle-auth {
                width: 44px;
                height: 24px;
                top: 16px;
                left: 16px;
            }

            [dir="rtl"] .theme-toggle-auth {
                left: auto;
                right: 16px;
            }

            .theme-toggle-slider-auth {
                width: 18px;
                height: 18px;
            }

            .rtl-toggle-auth {
                padding: 0.4rem;
                top: 16px;
                left: 70px;
            }

            [dir="rtl"] .rtl-toggle-auth {
                left: auto;
                right: 70px;
            }

            .back-home {
                top: 16px;
                right: 16px;
                font-size: 0.875rem;
            }

            [dir="rtl"] .back-home {
                right: auto;
                left: 16px;
            }
        }

        /* Loading State */
        .loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .loading .submit-btn::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <!-- Left Side - Visual/Branding -->
        <div class="auth-visual">
            <div class="auth-brand">
                <div class="auth-logo">
                    <i class="fas fa-utensils"></i>
                </div>
                <h1>TasteIT</h1>
                <p>Where Every Meal Becomes a Memorable Experience</p>
            </div>

            <div class="auth-features">
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <span>Award-Winning Cuisine</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-shipping-fast"></i>
                    </div>
                    <span>Fast & Reliable Delivery</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-gift"></i>
                    </div>
                    <span>Exclusive Member Rewards</span>
                </div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="auth-form-container">
            <!-- Theme toggle removed -->

            <button id="rtlToggle" class="rtl-toggle-auth" aria-label="Toggle RTL" style="color: var(--text-primary);">
                <i class="fas fa-globe"></i>
            </button>

            <a href="index.html" class="back-home">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>

            <!-- Mobile Header Container -->
            <div class="mobile-auth-header">
                <h2>Welcome Back!</h2>
                <p>Login to access your account</p>
            </div>

            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h2>Welcome Back!</h2>
                    <p>Login to access your account</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-envelope form-icon"></i>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="form-input-wrapper">
                            <i class="fas fa-lock form-icon"></i>
                            <input type="password" id="password" class="form-input" placeholder="Enter your password"
                                required>
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                <i class="fas fa-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Login</span>
                    </button>
                </form>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i>
                    </button>
                    <button class="social-btn facebook" onclick="socialLogin('facebook')">
                        <i class="fab fa-facebook-f"></i>
                    </button>
                    <button class="social-btn apple" onclick="socialLogin('apple')">
                        <i class="fab fa-apple"></i>
                    </button>
                </div>

                <div class="auth-switch">
                    Don't have an account? <a href="register.html">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>

    <script>
        // Password Toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }

        // Scale to Fit Logic
        function scaleToFit() {
            const container = document.querySelector('.auth-container');
            const targetWidth = 1920; // Design base width
            const targetHeight = 1080; // Design base height (optional usage)

            // Current viewport dimensions
            const availableWidth = window.innerWidth;
            const availableHeight = window.innerHeight;

            // Simple scale logic: fit height mostly to avoid scrolling
            // Check if content overflows height
            // We want to force it to fit in availableHeight

            // Reset for calculation
            container.style.transform = 'scale(1)';
            container.style.width = '100%';
            container.style.height = '100vh';

            // However, we want the content to scale down if it would scroll
            // Since the design is flex 100vh, it should fit unless screen is very small
            // We can scale the body's font-size or zoom, or use a transform on the main container

            // Better approach for "shrink to fit":
            // 1. Measure the natural height needed by contents (or assume 800-900px min)
            // 2. If availableHeight < natural height, scale down.

            const minHeight = 700; // px
            if (availableHeight < minHeight) {
                const scale = availableHeight / minHeight;
                container.style.transform = `scale(${scale})`;
                container.style.width = `${100 / scale}%`;
                container.style.height = `${100 / scale}vh`;
            } else {
                container.style.transform = 'scale(1)';
                container.style.width = '100%';
                container.style.height = '100vh';
            }
        }

        window.addEventListener('resize', scaleToFit);
        window.addEventListener('load', scaleToFit);

        // Theme Toggle Removed

        // RTL Toggle
        document.getElementById('rtlToggle').addEventListener('click', () => {
            const html = document.documentElement;
            const currentDir = html.getAttribute('dir');
            html.setAttribute('dir', currentDir === 'rtl' ? 'ltr' : 'rtl');
            localStorage.setItem('direction', currentDir === 'rtl' ? 'ltr' : 'rtl');
        });

        // Load saved preferences
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const savedDirection = localStorage.getItem('direction');

            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            }

            if (savedDirection === 'rtl') {
                document.documentElement.setAttribute('dir', 'rtl');
            }
        });

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Add loading state
            form.classList.add('loading');

            // Simulate API call
            setTimeout(() => {
                form.classList.remove('loading');

                // Show success message
                if (window.TasteIT) {
                    window.TasteIT.showToast('Login successful! Redirecting...', 'success');
                }

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 1500);
            }, 2000);
        });

        // Social Login
        function socialLogin(provider) {
            if (window.TasteIT) {
                window.TasteIT.showToast(`Logging in with ${provider}...`, 'info');
            }

            // Simulate social login
            setTimeout(() => {
                if (window.TasteIT) {
                    window.TasteIT.showToast('Login successful!', 'success');
                }
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 1500);
            }, 2000);
        }

        // Input Animation
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function () {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            input.addEventListener('blur', function () {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>

</html>
